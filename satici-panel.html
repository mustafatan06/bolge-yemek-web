<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; padding: 15px; }
        .container { max-width: 950px; margin: 0 auto; }
        .header-bar { background: #fff; padding: 12px 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .header-bar h2 { font-size: 16px; font-weight: 800; color: #0f172a; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; text-decoration: none; }

        .card { background: #fff; border-radius: 12px; padding: 15px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .card h3 { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 12px; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 10px; }
        .form-group label { display: block; font-size: 10px; font-weight: 600; color: #475569; margin-bottom: 3px; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; }

        .btn-primary { background: #f97316; color: white; border: none; padding: 9px 15px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 11px; }
        th { font-weight: 700; color: #475569; background: #f8fafc; }
        td img { width: 35px; height: 35px; object-fit: cover; border-radius: 4px; background: #eee; }
        
        .durum-btn { padding: 4px 8px; border-radius: 4px; font-weight: 700; font-size: 9px; border: none; cursor: pointer; margin-right: 3px; color: #fff; }
        .btn-hazirlaniyor { background: #f59e0b; }
        .btn-yolactikti { background: #3b82f6; }
        .btn-teslim { background: #10b981; }
        .btn-iptal { background: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>İşletme: <span id="isletmeAdiBaslik" style="color:#f97316;">Yükleniyor...</span></h2>
            <button class="logout-btn" onclick="localStorage.clear(); window.location.href='satici-giris.html';">Çıkış</button>
        </div>

        <div class="card">
            <h3>İşletme Bilgileri & Logo Güncelle</h3>
            <div class="form-grid">
                <div class="form-group"><label>İşletme Adı</label><input type="text" id="dukkanAdi"></div>
                <div class="form-group"><label>Telefon</label><input type="text" id="dukkanTel"></div>
                <div class="form-group"><label>Yeni Şifre</label><input type="password" id="dukkanSifre" placeholder="Boş bırakırsanız değişmez"></div>
                <div class="form-group"><label>Logo Seç</label><input type="file" id="dukkanLogo" accept="image/*"></div>
            </div>
            <button type="button" class="btn-primary" onclick="bilgileriGuncelle()">Kaydet</button>
        </div>

        <!-- GARANTİ SESLİ BİLDİRİM SİSTEMLİ SİPARİŞLER -->
        <div class="card" style="border: 2px solid #10b981; background: #f0fdf4;">
            <h3 style="color: #047857;"><i class="fa-solid fa-bell fa-shake"></i> Gelen Canlı Siparişler (Sesli Bildirim Aktif)</h3>
            <table>
                <thead><tr><th>Müşteri</th><th>Seçimli Ürünler / Tutar</th><th>Adres & Tel</th><th>Mevcut Durum</th><th>Durum Güncelle</th></tr></thead>
                <tbody id="gelenSiparislerListesi"><tr><td colspan="5" style="color:#64748b;">Yeni sipariş bekleniyor...</td></tr></tbody>
            </table>
        </div>

        <div class="card">
            <h3>Yeni Ürün Ekle</h3>
            <div class="form-grid">
                <div class="form-group"><label>Ürün Adı *</label><input type="text" id="urunAdi" placeholder="Çiğ Köfte Dürüm"></div>
                <div class="form-group"><label>Fiyat (TL) *</label><input type="number" id="urunFiyat" placeholder="150"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Açıklama *</label><textarea id="urunAciklama" rows="2" placeholder="Malzeme seçilebilir..."></textarea></div>
                <div class="form-group" style="grid-column: span 2;"><label>Görsel *</label><input type="file" id="urunDosya" accept="image/*"></div>
            </div>
            <button type="button" class="btn-primary" onclick="urunEkle()">Onaya Gönder</button>
        </div>

        <div class="card">
            <h3>Yayındaki Ürünler</h3>
            <table><thead><tr><th>Görsel</th><th>Ad</th><th>Fiyat</th><th>İşlem</th></tr></thead><tbody id="menuListesi"></tbody></table>
        </div>
    </div>

    <!-- GARANTİ SES ÇALMA İÇİN GİZLİ AUDIO ELEMENTİ -->
    <audio id="bildirimSesi" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const saticiKey = localStorage.getItem('aktifSaticiKey');
        const saticiAdi = localStorage.getItem('aktifSaticiAdi');
        if(!saticiKey) { window.location.href = 'satici-giris.html'; }

        db.ref('active_restaurants/' + saticiKey).once('value').then(snapshot => {
            const r = snapshot.val();
            if(r) {
                document.getElementById('isletmeAdiBaslik').innerText = r.ad;
                document.getElementById('dukkanAdi').value = r.ad;
                document.getElementById('dukkanTel').value = r.telefon;
            }
        });

        function bilgileriGuncelle() {
            const yeniAd = document.getElementById('dukkanAdi').value.trim();
            const yeniTel = document.getElementById('dukkanTel').value.trim();
            const yeniSifre = document.getElementById('dukkanSifre').value.trim();
            const logoInput = document.getElementById('dukkanLogo');
            const data = { ad: yeniAd, telefon: yeniTel };
            if(yeniSifre) data.sifre = yeniSifre;

            if(logoInput.files.length > 0) {
                const reader = new FileReader();
                reader.readAsDataURL(logoInput.files[0]);
                reader.onload = function(e) {
                    data.gorsel = e.target.result;
                    db.ref('active_restaurants/' + saticiKey).update(data).then(() => { alert("Güncellendi!"); location.reload(); });
                };
            } else {
                db.ref('active_restaurants/' + saticiKey).update(data).then(() => { alert("Güncellendi!"); location.reload(); });
            }
        }

        // GARANTİ SESLİ BİLDİRİM ÇALMA FONKSİYONU
        let ilkYukleme = true;
        db.ref('orders/' + saticiKey).on('value', snapshot => {
            const tbody = document.getElementById('gelenSiparislerListesi');
            tbody.innerHTML = '';
            const data = snapshot.val();
            if(!data) { 
                tbody.innerHTML = '<tr><td colspan="5" style="color:#64748b;">Yeni sipariş yok.</td></tr>'; 
                ilkYukleme = false;
                return; 
            }
            
            if(!ilkYukleme) {
                const ses = document.getElementById('bildirimSesi');
                ses.play().catch(err => console.log("Ses çalma izni bekleniyor"));
            }
            ilkYukleme = false;

            Object.keys(data).forEach(sKey => {
                const o = data[sKey];
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${o.musteriAdi}</strong></td>
                        <td>${o.urunAdi}<br><strong style="color:#f97316;">${o.toplamFiyat} ₺</strong></td>
                        <td>${o.musteriTel}<br><small style="color:#64748b;">${o.musteriAdres || ''}</small></td>
                        <td><span style="font-weight:800; color:#0f172a;">${o.durum || 'Hazırlanıyor'}</span></td>
                        <td>
                            <button class="durum-btn btn-hazirlaniyor" onclick="siparisDurumGuncelle('${sKey}', 'Hazırlanıyor')">Hazırlanıyor</button>
                            <button class="durum-btn btn-yolactikti" onclick="siparisDurumGuncelle('${sKey}', 'Yola Çıktı')">Yola Çıktı</button>
                            <button class="durum-btn btn-teslim" onclick="siparisDurumGuncelle('${sKey}', 'Teslim Edildi')">Teslim</button>
                            <button class="durum-btn btn-iptal" onclick="siparisDurumGuncelle('${sKey}', 'İptal Edildi')">İptal</button>
                        </td>
                    </tr>
                `;
            });
        });

        function siparisDurumGuncelle(siparisId, yeniDurum) {
            db.ref('orders/' + saticiKey + '/' + siparisId).update({ durum: yeniDurum });
            db.ref('customer_orders/' + siparisId).update({ durum: yeniDurum }).then(() => {
                alert("Durum '" + yeniDurum + "' olarak güncellendi.");
            });
        }

        function urunEkle() {
            const ad = document.getElementById('urunAdi').value.trim();
            const fiyat = document.getElementById('urunFiyat').value.trim();
            const aciklama = document.getElementById('urunAciklama').value.trim();
            const fileInput = document.getElementById('urunDosya');
            if(!ad || !fiyat || fileInput.files.length === 0) { alert("Eksik alan."); return; }
            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = function (e) {
                const uId = 'urun_' + Date.now();
                db.ref('pending_products/' + saticiKey + '/' + uId).set({
                    id: uId, ad, fiyat, aciklama, gorsel: e.target.result, isletmeAdi: saticiAdi
                }).then(() => { alert("Onaya gönderildi!"); location.reload(); });
            };
        }

        db.ref('restaurant_products/' + saticiKey).once('value').then(snapshot => {
            const tbody = document.getElementById('menuListesi'); tbody.innerHTML = '';
            const data = snapshot.val(); if(!data) return;
            Object.keys(data).forEach(key => {
                const u = data[key];
                tbody.innerHTML += `<tr><td><img src="${u.gorsel}"></td><td><strong>${u.ad}</strong></td><td>${u.fiyat} ₺</td><td><button class="action-btn" onclick="db.ref('restaurant_products/${saticiKey}/${key}').remove(); location.reload();">Sil</button></td></tr>`;
            });
        });
    </script>
</body>
</html>
