<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bölge Yemek | Süper Admin Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; display: flex; min-height: 100vh; }

        /* Sidebar */
        sidebar { width: 260px; background: #0f172a; color: #fff; display: flex; flex-direction: column; padding: 20px; }
        .sidebar-brand { font-size: 20px; font-weight: 900; text-transform: uppercase; margin-bottom: 30px; letter-spacing: 0.5px; }
        .sidebar-brand span { color: #f97316; }
        .menu-item { padding: 12px 15px; color: #94a3b8; text-decoration: none; border-radius: 10px; font-weight: 600; font-size: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; transition: 0.3s; cursor: pointer; }
        .menu-item:hover, .menu-item.active { background: #f97316; color: #fff; }

        /* Main Content */
        .main-content { flex: 1; padding: 30px; overflow-y: auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: #fff; padding: 15px 25px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .top-bar h2 { font-size: 20px; font-weight: 800; color: #0f172a; }
        .back-site-btn { background: rgba(249,115,22,0.1); color: #f97316; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 700; font-size: 13px; }

        .card { background: #fff; border-radius: 16px; padding: 25px; margin-bottom: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        .card h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #f1f5f9; padding-bottom: 10px; }
        
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        .form-group input:focus { border-color: #f97316; }

        .btn-primary { background: #f97316; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(249,115,22,0.3); }
        .btn-primary:hover { background: #ea580c; }

        /* Tables & Lists */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
        th { font-weight: 700; color: #475569; background: #f8fafc; }
        td img { width: 45px; height: 45px; object-fit: cover; border-radius: 8px; }
        .action-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 11px; }
        
        .loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; color: white; font-size: 18px; font-weight: 700; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-overlay"><i class="fa-solid fa-spinner fa-spin"></i> İşlem Yapılıyor, Lütfen Bekleyin...</div>

    <sidebar>
        <div class="sidebar-brand">Bölge <span>Yönetim</span></div>
        <a class="menu-item active"><i class="fa-solid fa-utensils"></i> Kategorileri Yönet</a>
        <a class="menu-item"><i class="fa-solid fa-store"></i> Satıcı Başvuruları</a>
        <a class="menu-item"><i class="fa-solid fa-chart-line"></i> Genel Ayarlar</a>
    </sidebar>

    <div class="main-content">
        <div class="top-bar">
            <h2>Süper Admin Kontrol Paneli</h2>
            <a href="index.html" class="back-site-btn"><i class="fa-solid fa-globe"></i> Siteye Git</a>
        </div>

        <!-- YENİ KATEGORİ EKLEME KARTI -->
        <div class="card">
            <h3><i class="fa-solid fa-plus-circle" style="color:#f97316;"></i> Yeni Yemek Kategorisi Ekle</h3>
            <div class="form-grid">
                <div class="form-group">
                    <label>Kategori Adı *</label>
                    <input type="text" id="katAdi" placeholder="Örn: Kebap & Izgara">
                </div>
                <div class="form-group">
                    <label>URL Kodu (Slug) *</label>
                    <input type="text" id="katSlug" placeholder="Örn: kebap-izgara">
                </div>
                <div class="form-group">
                    <label>Durum / Açıklama</label>
                    <input type="text" id="katDurum" value="Yakında" placeholder="Örn: 1 Aktif Mağaza veya Yakında">
                </div>
                <div class="form-group">
                    <label>Kategori Görseli Seç (Dosya) *</label>
                    <input type="file" id="katDosya" accept="image/*">
                </div>
            </div>
            <button type="button" class="btn-primary" onclick="kategoriEkle()"><i class="fa-solid fa-upload"></i> Kategoriyi Yükle ve Ekle</button>
        </div>

        <!-- MEVCUT KATEGORİLER LİSTESİ -->
        <div class="card">
            <h3><i class="fa-solid fa-list" style="color:#f97316;"></i> Sistemdeki Kategoriler</h3>
            <table>
                <thead>
                    <tr>
                        <th>Görsel</th>
                        <th>Kategori Adı</th>
                        <th>Slug</th>
                        <th>Durum</th>
                        <th>İşlem</th>
                    </tr>
                </thead>
                <tbody id="kategoriListesi">
                    <!-- Dinamik yüklenecek -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Firebase SDK (Hem Database hem Storage destekli) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        const storage = firebase.storage();

        // Kategorileri Listele
        db.ref('categories').on('value', (snapshot) => {
            const tbody = document.getElementById('kategoriListesi');
            tbody.innerHTML = '';
            const data = snapshot.val();
            if(!data) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b;">Henüz kategori eklenmemiş.</td></tr>';
                return;
            }
            Object.keys(data).forEach(key => {
                const kat = data[key];
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${kat.gorsel}" alt=""></td>
                        <td><strong>${kat.ad}</strong></td>
                        <td><code>${kat.slug}</code></td>
                        <td>${kat.durum}</td>
                        <td><button class="action-btn" onclick="kategoriSil('${key}')"><i class="fa-solid fa-trash"></i> Sil</button></td>
                    </tr>
                `;
            });
        });

        // Yeni Kategori Ekle ve Firebase Storage'a Resim Yükle
        function kategoriEkle() {
            const ad = document.getElementById('katAdi').value.trim();
            const slug = document.getElementById('katSlug').value.trim();
            const durum = document.getElementById('katDurum').value.trim();
            const fileInput = document.getElementById('katDosya');

            if(!ad || !slug || fileInput.files.length === 0) {
                alert("Lütfen kategori adını, slug kodunu ve bir görsel dosyası seçin.");
                return;
            }

            const file = fileInput.files[0];
            const storageRef = storage.ref('categories/' + Date.now() + '_' + file.name);
            
            document.getElementById('loadingOverlay').style.display = 'flex';

            storageRef.put(file).then(snapshot => {
                return snapshot.ref.getDownloadURL();
            }).then(downloadURL => {
                const catId = 'cat_' + Date.now();
                return db.ref('categories/' + catId).set({
                    id: catId,
                    ad: ad,
                    slug: slug,
                    durum: durum || 'Yakında',
                    gorsel: downloadURL
                });
            }).then(() => {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Kategori ve görsel başarıyla yüklendi!");
                document.getElementById('katAdi').value = '';
                document.getElementById('katSlug').value = '';
                document.getElementById('katDosya').value = '';
            }).catch(error => {
                document.getElementById('loadingOverlay').style.display = 'none';
                alert("Hata oluştu: " + error.message);
            });
        }

        // Kategori Sil
        function kategoriSil(key) {
            if(confirm("Bu kategoriyi silmek istediğinize emin misiniz?")) {
                db.ref('categories/' + key).remove().then(() => {
                    alert("Kategori silindi.");
                });
            }
        }
    </script>
</body>
</html>
