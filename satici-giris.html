<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bölge Yemek | Satıcı Girişi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; color: #1e293b; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }
        .login-card { background: #ffffff; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; }
        .logo { font-size: 22px; font-weight: 800; text-transform: uppercase; margin-bottom: 20px; display: block; text-decoration: none; }
        .logo .bolge { color: #0f172a; } .logo .yemek { color: #f97316; }
        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 12px; color: #475569; margin-bottom: 5px; font-weight: 600; }
        .form-group input { width: 100%; padding: 11px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 13px; outline: none; }
        .form-group input:focus { border-color: #f97316; }
        .btn-primary { background: #f97316; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 15px rgba(249,115,22,0.3); }
        .btn-primary:hover { background: #ea580c; }
        .back-link { display: block; margin-top: 15px; font-size: 12px; color: #64748b; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="login-card">
        <a href="index.html" class="logo"><span class="bolge">Bölge</span> <span class="yemek">Yemek</span></a>
        <h3 style="font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 20px;">İşletme / Satıcı Paneli Girişi</h3>
        
        <div class="form-group">
            <label>İşletme Adınız *</label>
            <input type="text" id="girisIsletme" placeholder="Örn: Pan Çiğ Köfte">
        </div>
        <div class="form-group">
            <label>Şifreniz *</label>
            <input type="password" id="girisSifre" placeholder="Satıcı Şifreniz">
        </div>
        
        <button type="button" class="btn-primary" onclick="saticiGirisYap()">Panele Giriş Yap</button>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Ana Sayfaya Dön</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        function saticiGirisYap() {
            const isletmeAd = document.getElementById('girisIsletme').value.trim();
            const sifre = document.getElementById('girisSifre').value.trim();

            if(!isletmeAd || !sifre) { alert("Lütfen tüm alanları doldurun."); return; }

            db.ref('active_restaurants').once('value').then(snapshot => {
                const data = snapshot.val();
                if(!data) { alert("Sistemde kayıtlı işletme bulunamadı."); return; }

                let bulunanKey = null;
                Object.keys(data).forEach(key => {
                    if(data[key].ad.toLowerCase() === isletmeAd.toLowerCase() && data[key].sifre === sifre) {
                        bulunanKey = key;
                    }
                });

                if(bulunanKey) {
                    localStorage.setItem('aktifSaticiKey', bulunanKey);
                    localStorage.setItem('aktifSaticiAdi', data[bulunanKey].ad);
                    window.location.href = 'satici-panel.html';
                } else {
                    alert("İşletme adı veya şifre hatalı!");
                }
            });
        }
    </script>
</body>
</html>
