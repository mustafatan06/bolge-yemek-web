<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bölge Yemek | Lezzetin Adresi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8fafc; color: #1e293b; padding-bottom: 90px; overflow-x: hidden; }

        header { background: #ffffff; border-bottom: 2px solid #f97316; padding: 15px 4%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding-top: max(15px, env(safe-area-inset-top)); }
        .logo { font-size: 18px; font-weight: 900; text-transform: uppercase; text-decoration: none; }
        .logo .bolge { color: #0f172a; } .logo .yemek { color: #f97316; }

        .container { max-width: 900px; margin: 0 auto; padding: 15px; }

        /* HERO ALANI */
        .hero { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; padding: 25px 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-bottom: 4px solid #f97316; }
        .hero h1 { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
        .hero p { font-size: 11px; opacity: 0.85; }

        .section-title { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 12px; border-left: 4px solid #f97316; padding-left: 8px; }

        /* KATEGORİLER */
        .kategori-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 25px; }
        @media(max-width: 600px) { .kategori-grid { grid-template-columns: repeat(2, 1fr); } }
        .kategori-kart { background: #fff; border-radius: 12px; padding: 10px; text-align: center; border: 1px solid #e2e8f0; cursor: pointer; transition: 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.02); text-decoration: none; color: inherit; }
        .kategori-kart:hover { transform: translateY(-3px); border-color: #f97316; }
        .kategori-kart img { width: 45px; height: 45px; object-fit: cover; border-radius: 50%; margin-bottom: 6px; background: #f1f5f9; }
        .kategori-kart h4 { font-size: 11px; font-weight: 700; color: #0f172a; }

        /* İŞLETMELER */
        .restoran-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        @media(min-width: 600px) { .restoran-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .restoran-kart { background: #fff; border-radius: 14px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; text-decoration: none; color: inherit; box-shadow: 0 3px 10px rgba(0,0,0,0.02); transition: 0.2s; cursor: pointer; }
        .restoran-kart:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .restoran-kart img { width: 100px; height: 100px; object-fit: cover; background: #f1f5f9; flex-shrink: 0; }
        .restoran-bilgi { padding: 12px; display: flex; flex-direction: column; justify-content: center; flex: 1; }
        .restoran-bilgi h3 { font-size: 13px; font-weight: 900; color: #0f172a; margin-bottom: 3px; }
        .restoran-bilgi p { font-size: 10px; color: #64748b; margin-bottom: 6px; }
        .restoran-meta { display: flex; gap: 10px; font-size: 10px; font-weight: 700; color: #475569; }
        .restoran-meta span { color: #f59e0b; }

        /* GÖRSELLER TAMAMEN YÜKLENENE KADAR DURAN AKILLI KURYE EKRANI */
        #kuryeYukleniyor { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #ffffff; z-index: 999999; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 15px; transition: opacity 0.4s ease; }
        .kurye-ikon { font-size: 55px; color: #f97316; animation: kuryeSurus 1.2s infinite ease-in-out; }
        @keyframes kuryeSurus { 0%, 100% { transform: translateX(-15px); } 50% { transform: translateX(15px); } }

        /* ALT NAVİGASYON BAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; justify-content: space-around; padding: 10px 0; z-index: 999; padding-bottom: max(10px, env(safe-area-inset-bottom)); box-shadow: 0 -4px 20px rgba(0,0,0,0.04); }
        .nav-item { text-align: center; text-decoration: none; color: #64748b; font-size: 10px; font-weight: 700; display: flex; flex-direction: column; gap: 3px; }
        .nav-item i { font-size: 16px; }
        .nav-item.active { color: #f97316; }
    </style>
</head>
<body>

    <!-- AKILLI YÜKLENME EKRANI (GÖRSELLER BİTİNCE KAYBOLUR) -->
    <div id="kuryeYukleniyor">
        <div class="kurye-ikon"><i class="fa-solid fa-motorcycle fa-bounce"></i></div>
        <div style="font-size: 13px; font-weight: 800; color: #0f172a;">Lezzetler Hazırlanıyor, Sayfa Yükleniyor...</div>
    </div>

    <header>
        <a href="index.html" class="logo"><span class="bolge">Bölge</span> <span class="yemek">Yemek</span></a>
        <div style="display: flex; gap: 10px;">
            <a href="satici-giris.html" style="font-size:11px; font-weight:700; color:#475569; text-decoration:none; padding:6px 12px; background:#f1f5f9; border-radius:6px;">İşletme Girişi</a>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1 id="heroBaslik">Altındağ'ın En Lezzetli Pazar Yeri</h1>
            <p id="heroSlogan">Yüzlerce lezzet kapında, siparişin anında cebinde!</p>
        </div>

        <h3 class="section-title">Kategoriler</h3>
        <div class="kategori-grid" id="kategoriListesi">
            <!-- Kategoriler dinamik yüklenir -->
        </div>

        <h3 class="section-title">Popüler İşletmeler</h3>
        <div class="restoran-grid" id="isletmelerListesi">
            <div style="font-size: 11px; color: #64748b;">İşletmeler yükleniyor...</div>
        </div>
    </div>

    <!-- ALT MENÜ -->
    <div class="bottom-nav">
        <a href="index.html" class="nav-item active"><i class="fa-solid fa-house"></i> Ana Sayfa</a>
        <a href="satici-giris.html" class="nav-item"><i class="fa-solid fa-store"></i> Satıcı Paneli</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        let yuklenenGorselSayisi = 0;
        let toplamGorselSayisi = 0;

        function gorselYuklendiKontrol() {
            yuklenenGorselSayisi++;
            if(yuklenenGorselSayisi >= toplamGorselSayisi) {
                kuryeEkraniniKapat();
            }
        }

        function kuryeEkraniniKapat() {
            const loader = document.getElementById('kuryeYukleniyor');
            if(loader && loader.style.display !== 'none') {
                loader.style.opacity = '0';
                setTimeout(() => { loader.style.display = 'none'; }, 400);
            }
        }

        // Güvenlik zaman aşımı (Maksimum 2 saniye içinde her türlü açılır)
        setTimeout(() => { kuryeEkraniniKapat(); }, 2000);

        // Site Ayarları (Hero Başlık ve Slogan)
        db.ref('site_settings').once('value').then(snapshot => {
            const s = snapshot.val();
            if(s) {
                if(s.heroBaslik) document.getElementById('heroBaslik').innerText = s.heroBaslik;
                if(s.heroSlogan) document.getElementById('heroSlogan').innerText = s.heroSlogan;
            }
        });

        // Kategorileri Çek
        db.ref('categories').once('value').then(snapshot => {
            const katGrid = document.getElementById('kategoriListesi');
            katGrid.innerHTML = '';
            const data = snapshot.val();
            if(!data) { katGrid.innerHTML = '<div style="font-size:11px; color:#64748b;">Kategori yok.</div>'; return; }
            
            let katKeys = Object.keys(data);
            toplamGorselSayisi += katKeys.length;

            katKeys.forEach(k => {
                const c = data[k];
                katGrid.innerHTML += `
                    <a href="index.html?kat=${c.slug}" class="kategori-kart">
                        <img src="${c.gorsel}" onload="gorselYuklendiKontrol()" onerror="gorselYuklendiKontrol()" alt="${c.ad}">
                        <h4>${c.ad}</h4>
                    </a>
                `;
            });
        });

        // İşletmeleri ve Puanlarını Çek
        db.ref('active_restaurants').once('value').then(snapshot => {
            const restGrid = document.getElementById('isletmelerListesi');
            restGrid.innerHTML = '';
            const data = snapshot.val();
            if(!data) { restGrid.innerHTML = '<div style="font-size:11px; color:#64748b;">Henüz aktif işletme bulunmuyor.</div>'; kuryeEkraniniKapat(); return; }

            let restKeys = Object.keys(data);
            toplamGorselSayisi += restKeys.length;

            restKeys.forEach(rKey => {
                const r = data[rKey];
                
                // Her işletmenin ortalama puanını hesapla
                db.ref('restaurant_reviews/' + rKey).once('value').then(revSnap => {
                    const revData = revSnap.val();
                    let puanYazisi = '<i class="fa-solid fa-star" style="color:#94a3b8;"></i> Yeni';
                    if(revData) {
                        let toplam = 0, adet = 0;
                        Object.keys(revData).forEach(rk => {
                            toplam += parseFloat(revData[rk].genelPuan || 5);
                            adet++;
                        });
                        const ort = (toplam / adet).toFixed(1);
                        puanYazisi = `<i class="fa-solid fa-star"></i> ${ort} (${adet})`;
                    }

                    restGrid.innerHTML += `
                        <a href="isletme.html?id=${rKey}" class="restoran-kart">
                            <img src="${r.gorsel || 'https://i.imgur.com/7y4aCVb.jpg'}" onload="gorselYuklendiKontrol()" onerror="gorselYuklendiKontrol()" alt="${r.ad}">
                            <div class="restoran-bilgi">
                                <h3>${r.ad}</h3>
                                <p>${r.kategori || 'Lezzet'}</p>
                                <div class="restoran-meta">
                                    <span>${puanYazisi}</span>
                                    <span><i class="fa-solid fa-clock" style="color:#f97316;"></i> 20-30 dk</span>
                                </div>
                            </div>
                        </a>
                    `;
                });
            });
        });
    </script>
</body>
</html>
