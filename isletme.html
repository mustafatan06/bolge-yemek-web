<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>İşletme Menüsü | Bölge Yemek</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: #f8fafc; color: #1e293b; padding-bottom: 100px; overflow-x: hidden; }

        header { background: #ffffff; border-bottom: 2px solid #f97316; padding: 15px 4% 10px 4%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding-top: max(15px, env(safe-area-inset-top)); }
        .logo { font-size: 17px; font-weight: 800; text-transform: uppercase; text-decoration: none; }
        .logo .bolge { color: #0f172a; } .logo .yemek { color: #f97316; }

        .container { max-width: 900px; margin: 0 auto; padding: 15px; }
        .rest-header { background: #fff; padding: 18px; border-radius: 14px; border: 1px solid #e2e8f0; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 3px 10px rgba(0,0,0,0.02); }
        .rest-left { display: flex; gap: 12px; align-items: center; }
        .rest-header img { width: 70px; height: 70px; object-fit: cover; border-radius: 10px; background: #f1f5f9; }
        .rest-header h1 { font-size: 16px; font-weight: 900; color: #0f172a; margin-bottom: 2px; }
        .rest-header p { font-size: 10px; color: #64748b; }

        .section-title { font-size: 14px; font-weight: 800; color: #0f172a; margin-bottom: 10px; border-left: 4px solid #f97316; padding-left: 8px; }
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        @media(min-width: 600px) { .menu-grid { grid-template-columns: repeat(2, 1fr); } }
        
        .menu-item-card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .menu-item-left { display: flex; gap: 10px; align-items: center; flex: 1; }
        .menu-item-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #f1f5f9; flex-shrink: 0; }
        .menu-info { flex: 1; min-width: 0; }
        .menu-info h4 { font-size: 12px; font-weight: 800; color: #0f172a; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .menu-info p { font-size: 10px; color: #64748b; margin-bottom: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-info span { font-size: 11px; font-weight: 800; color: #f97316; display: block; margin-top: 2px; }

        .adet-box { display: flex; align-items: center; gap: 4px; margin-top: 4px; }
        .adet-btn { width: 20px; height: 20px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 10px; display: flex; align-items: center; justify-content: center; }
        .adet-input { width: 26px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 10px; font-weight: 700; background: #fff; }
        .siparis-btn { background: #10b981; color: white; border: none; padding: 6px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; cursor: pointer; white-space: nowrap; }

        /* SABİT PROFESYONEL SEPET BAR */
        .sabit-sepet-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; border-top: 2px solid #f97316; padding: 12px 5%; display: none; justify-content: space-between; align-items: center; z-index: 9999; box-shadow: 0 -5px 25px rgba(0,0,0,0.15); padding-bottom: max(12px, env(safe-area-inset-bottom)); }
        .sabit-sepet-bar .bilgi { color: #fff; font-size: 12px; font-weight: 700; }
        .sabit-sepet-bar .bilgi span { color: #f97316; font-size: 14px; }
        .sabit-sepet-bar button { background: #f97316; color: white; border: none; padding: 9px 18px; border-radius: 6px; font-weight: 800; font-size: 12px; cursor: pointer; }

        /* PROFESYONEL CHECKOUT (ÖDEME/ADRES) MODALI */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 10000; padding: 15px; }
        .modal-content { background: #ffffff; padding: 20px; border-radius: 16px; width: 100%; max-width: 420px; border: 1px solid #e2e8f0; box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
        .modal-header h3 { font-size: 15px; font-weight: 800; color: #0f172a; }
        .close-modal { background: none; border: none; font-size: 16px; cursor: pointer; color: #64748b; }
        
        .sepet-urun-satir { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 11px; }
        .form-group { margin-bottom: 10px; text-align: left; }
        .form-group label { display: block; font-size: 10px; font-weight: 600; color: #475569; margin-bottom: 3px; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 11px; outline: none; }
        .btn-tamamla { width: 100%; background: #10b981; color: white; border: none; padding: 11px; border-radius: 8px; font-weight: 800; font-size: 13px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><span class="bolge">Bölge</span> <span class="yemek">Yemek</span></a>
        <a href="index.html" style="font-size:11px; font-weight:700; color:#f97316; text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Ana Sayfa</a>
    </header>

    <div class="container">
        <div class="rest-header">
            <div class="rest-left">
                <img id="restLogo" src="https://i.imgur.com/7y4aCVb.jpg">
                <div>
                    <h1 id="restAdi">Yükleniyor...</h1>
                    <p id="restKategoriTel">Yükleniyor...</p>
                </div>
            </div>
        </div>

        <h3 class="section-title">İşletme Menüsü</h3>
        <div class="menu-grid" id="isletmeUrunleri">
            <div style="font-size: 11px; color: #64748b;">Menü yükleniyor...</div>
        </div>
    </div>

    <!-- EKRANIN DİBİNE SABİTLENMİŞ SEPET BAR -->
    <div id="sabitSepetBar" class="sabit-sepet-bar">
        <div class="bilgi"><span id="sepetUrunSayisi">0</span> Ürün | <span id="sepetToplamFiyat">0</span> ₺</div>
        <button type="button" onclick="checkoutModalAc()">Sepeti Onayla</button>
    </div>

    <!-- PROFESYONEL CHECKOUT (ADRES VE ÖDEME ONAY) MODALI -->
    <div id="checkoutModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-basket-shopping" style="color:#f97316;"></i> Siparişi Tamamla</h3>
                <button class="close-modal" onclick="document.getElementById('checkoutModal').style.display='none'"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div style="margin-bottom: 12px;">
                <h4 style="font-size: 12px; font-weight: 800; margin-bottom: 5px; color: #0f172a;">Sepetinizdeki Ürünler</h4>
                <div id="modalSepetListesi"></div>
            </div>

            <div class="form-group">
                <label>Teslimat Adresiniz *</label>
                <textarea id="siparisAdres" rows="2" placeholder="Sokak, bina no, daire, tarif..."></textarea>
            </div>

            <div class="form-group">
                <label>Ödeme Yöntemi *</label>
                <select id="odemeYontemi">
                    <option value="Kapıda Nakit">Kapıda Nakit Ödeme</option>
                    <option value="Kapıda Kredi Kartı">Kapıda Kredi Kartı</option>
                </select>
            </div>

            <div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 800; margin: 12px 0; padding-top: 8px; border-top: 1px solid #e2e8f0;">
                <span>Toplam Tutar:</span>
                <span id="modalToplamTutar" style="color: #f97316;">0 ₺</span>
            </div>

            <button type="button" class="btn-tamamla" onclick="siparişiKesinlestir()">Siparişi Onayla & Gönder</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const isletmeId = urlParams.get('id');

        // SEPET ARRAY YAPISI
        let sepet = [];

        if(isletmeId) {
            db.ref('active_restaurants/' + isletmeId).once('value').then(snapshot => {
                const r = snapshot.val();
                if(r) {
                    document.getElementById('restAdi').innerText = r.ad;
                    document.getElementById('restKategoriTel').innerText = (r.kategori || 'Lezzet') + ' | Tel: ' + r.telefon;
                    if(r.gorsel) document.getElementById('restLogo').src = r.gorsel;
                }
            });

            db.ref('restaurant_products/' + isletmeId).once('value').then(snapshot => {
                const container = document.getElementById('isletmeUrunleri');
                container.innerHTML = '';
                const data = snapshot.val();
                if(!data) { container.innerHTML = '<div style="font-size:11px; color:#64748b;">Bu işletmenin menüsü henüz yok.</div>'; return; }
                
                let html = '';
                Object.keys(data).forEach(k => {
                    const u = data[k];
                    html += `
                        <div class="menu-item-card">
                            <div class="menu-item-left">
                                <img src="${u.gorsel}" alt="${u.ad}">
                                <div class="menu-info">
                                    <h4>${u.ad}</h4>
                                    <p>${u.aciklama || ''}</p>
                                    <span>${u.fiyat} ₺</span>
                                    <div class="adet-box">
                                        <button type="button" class="adet-btn" onclick="degisAdet('${k}', -1)">-</button>
                                        <input type="text" id="adet_${k}" class="adet-input" value="1" readonly>
                                        <button type="button" class="adet-btn" onclick="degisAdet('${k}', 1)">+</button>
                                    </div>
                                </div>
                            </div>
                            <button type="button" class="siparis-btn" onclick="sepeteEkle('${u.ad}', ${u.fiyat}, '${k}')">Sepete Ekle</button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            });
        }

        function degisAdet(key, m) {
            const inp = document.getElementById('adet_' + key);
            let val = parseInt(inp.value) + m;
            if(val < 1) val = 1;
            inp.value = val;
        }

        function sepeteEkle(urunAdi, birimFiyat, key) {
            const musteriAdi = localStorage.getItem('aktifMusteriAdi');
            const musteriTel = localStorage.getItem('aktifMusteriTel');

            if(!musteriAdi || !musteriTel) {
                alert("Sipariş verebilmek için lütfen önce ana sayfadan giriş yapın / kaydolun!");
                window.location.href = 'index.html';
                return;
            }

            const adet = parseInt(document.getElementById('adet_' + key).value);
            
            // Sepette aynı ürün varsa adedini artır, yoksa yeni ekle
            const mevcutUrun = sepet.find(item => item.urunAdi === urunAdi);
            if(mevcutUrun) {
                mevcutUrun.adet += adet;
                mevcutUrun.toplamFiyat = mevcutUrun.adet * birimFiyat;
            } else {
                sepet.push({
                    urunAdi: urunAdi,
                    birimFiyat: birimFiyat,
                    adet: adet,
                    toplamFiyat: birimFiyat * adet
                });
            }

            sepetiGuncelleBar();
        }

        function sepetiGuncelleBar() {
            let toplamAdet = 0;
            let genelToplam = 0;

            sepet.forEach(item => {
                toplamAdet += item.adet;
                genelToplam += item.toplamFiyat;
            });

            document.getElementById('sepetUrunSayisi').innerText = toplamAdet;
            document.getElementById('sepetToplamFiyat').innerText = genelToplam;

            const bar = document.getElementById('sabitSepetBar');
            if(toplamAdet > 0) {
                bar.style.display = 'flex';
            } else {
                bar.style.display = 'none';
            }
        }

        function checkoutModalAc() {
            const musteriAdresKayitli = localStorage.getItem('aktifMusteriAdres') || '';
            document.getElementById('siparisAdres').value = musteriAdresKayitli;

            const listeDiv = document.getElementById('modalSepetListesi');
            listeDiv.innerHTML = '';

            let genelToplam = 0;
            sepet.forEach((item, index) => {
                genelToplam += item.toplamFiyat;
                listeDiv.innerHTML += `
                    <div class="sepet-urun-satir">
                        <span><strong>${item.adet}x</strong> ${item.urunAdi}</span>
                        <span>${item.toplamFiyat} ₺ <button type="button" onclick="sepettenCikar(${index})" style="background:none; border:none; color:#ef4444; cursor:pointer; margin-left:6px;"><i class="fa-solid fa-trash"></i></button></span>
                    </div>
                `;
            });

            document.getElementById('modalToplamTutar').innerText = genelToplam + ' ₺';
            document.getElementById('checkoutModal').style.display = 'flex';
        }

        function sepettenCikar(index) {
            sepet.splice(index, 1);
            sepetiGuncelleBar();
            if(sepet.length === 0) {
                document.getElementById('checkoutModal').style.display = 'none';
            } else {
                checkoutModalAc();
            }
        }

        function siparişiKesinlestir() {
            const adres = document.getElementById('siparisAdres').value.trim();
            const odeme = document.getElementById('odemeYontemi').value;

            if(!adres) {
                alert("Lütfen teslimat adresinizi yazın.");
                return;
            }

            if(sepet.length === 0) {
                alert("Sepetiniz boş.");
                return;
            }

            const musteriAdi = localStorage.getItem('aktifMusteriAdi');
            const musteriTel = localStorage.getItem('aktifMusteriTel');

            // Toplam tutarı hesapla
            let genelToplam = 0;
            let urunlerOzet = [];
            sepet.forEach(item => {
                genelToplam += item.toplamFiyat;
                urunlerOzet.push(`${item.adet}x ${item.urunAdi}`);
            });

            const siparisId = 'siparis_' + Date.now();
            db.ref('orders/' + isletmeId + '/' + siparisId).set({
                siparisId, 
                musteriAdi, 
                musteriTel, 
                musteriAdres: adres, 
                odemeYontemi: odeme,
                urunAdi: urunlerOzet.join(', '), 
                adet: sepet.reduce((a, b) => a + b.adet, 0), 
                toplamFiyat: genelToplam, 
                tarih: new Date().toLocaleTimeString('tr-TR')
            }).then(() => {
                alert("Siparişiniz başarıyla alındı! İşletmeye sesli bildirim gönderildi.");
                sepet = [];
                sepetiGuncelleBar();
                document.getElementById('checkoutModal').style.display = 'none';
            }).catch(err => {
                alert("Sipariş hatası: " + err.message);
            });
        }
    </script>
</body>
</html>
