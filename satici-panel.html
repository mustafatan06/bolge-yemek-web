<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İşletme Yönetim Paneli</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f1f5f9; color: #1e293b; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .header-bar { background: #fff; padding: 15px 20px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
        .header-bar h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
        .logout-btn { background: #ef4444; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; font-size: 12px; cursor: pointer; text-decoration: none; }

        .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; }
        .card h3 { font-size: 15px; font-weight: 800; color: #0f172a; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #475569; margin-bottom: 4px; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #f97316; }

        .btn-primary { background: #f97316; color: white; border: none; padding: 11px 20px; border-radius: 6px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(249,115,22,0.2); }
        .btn-primary:hover { background: #ea580c; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
        th { font-weight: 700; color: #475569; background: #f8fafc; }
        td img { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; background: #f1f5f9; }
        .action-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-bar">
            <h2>İşletme Paneli: <span id="isletmeAdiBaslik" style="color:#f97316;">Yükleniyor...</span></h2>
            <button class="logout-btn" onclick="cikisYap()"><i class="fa-solid fa-right-from-bracket"></i> Çıkış Yap</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-burger" style="color:#f97316;"></i> Yeni Ürün & Menü Ekle</h3>
            <div class="form-grid">
                <div class="form-group"><label>Ürün / Menü Adı *</label><input type="text" id="urunAdi" placeholder="Örn: Zurna Dürüm Menü"></div>
                <div class="form-group"><label>Fiyat (TL) *</label><input type="number" id="urunFiyat" placeholder="150"></div>
                <div class="form-group" style="grid-column: span 2;"><label>Ürün Açıklaması / Detaylar *</label><textarea id="urunAciklama" rows="2" placeholder="İçindekiler, soslar vb..."></textarea></div>
                <div class="form-group" style="grid-column: span 2;"><label>Ürün Görseli Seç (Dosya) *</label><input type="file" id="urunDosya" accept="image/*"></div>
            </div>
            <button type="button" class="btn-primary" onclick="urunEkle()"><i class="fa-solid fa-upload"></i> Ürünü Menüye Ekle</button>
        </div>

        <div class="card">
            <h3><i class="fa-solid fa-list" style="color:#f97316;"></i> Menüdeki Ürünleriniz</h3>
            <table>
                <thead><tr><th>Görsel</th><th>Ürün Adı</th><th>Fiyat</th><th>Açıklama</th><th>İşlem</th></tr></thead>
                <tbody id="menuListesi"></tbody>
            </table>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey: "AIzaSyDMIz96KNZF-7zWGRuI-2fvQ72fZImHtUw",
          authDomain: "eretankartal.firebaseapp.com",
          databaseURL: "https://eretankartal-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "eretankartal",
          storageBucket: "eretankartal.firebasestorage.app",
          messagingSenderId: "775846519838",
          appId: "1:775846519838:web:75b1d7dfb4ef942a3f7a0f"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        const saticiKey = localStorage.getItem('aktifSaticiKey');
        const saticiAdi = localStorage.getItem('aktifSaticiAdi');

        if(!saticiKey) {
            alert("Lütfen önce satıcı girişi yapın!");
            window.location.href = 'satici-giris.html';
        } else {
            document.getElementById('isletmeAdiBaslik').innerText = saticiAdi;
            menuUrunleriniListele();
        }

        function cikisYap() {
            localStorage.removeItem('aktifSaticiKey');
            localStorage.removeItem('aktifSaticiAdi');
            window.location.href = 'satici-giris.html';
        }

        function urunEkle() {
            const ad = document.getElementById('urunAdi').value.trim();
            const fiyat = document.getElementById('urunFiyat').value.trim();
            const aciklama = document.getElementById('urunAciklama').value.trim();
            const fileInput = document.getElementById('urunDosya');

            if(!ad || !fiyat || fileInput.files.length === 0) { alert("Lütfen ürün adını, fiyatını ve görselini seçin."); return; }

            const reader = new FileReader();
            reader.readAsDataURL(fileInput.files[0]);
            reader.onload = function () {
                const urunId = 'urun_' + Date.now();
                db.ref('restaurant_products/' + saticiKey + '/' + urunId).set({
                    id: urunId, ad: ad, fiyat: fiyat, aciklama: aciklama, gorsel: reader.result
                }).then(() => {
                    alert("Ürün menüye eklendi!");
                    document.getElementById('urunAdi').value = '';
                    document.getElementById('urunFiyat').value = '';
                    document.getElementById('urunAciklama').value = '';
                    document.getElementById('urunDosya').value = '';
                });
            };
        }

        function menuUrunleriniListele() {
            db.ref('restaurant_products/' + saticiKey).on('value', (snapshot) => {
                const tbody = document.getElementById('menuListesi');
                tbody.innerHTML = '';
                const data = snapshot.val();
                if(!data) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#64748b;">Henüz ürün eklenmemiş.</td></tr>'; return; }
                Object.keys(data).forEach(key => {
                    const u = data[key];
                    tbody.innerHTML += `
                        <tr>
                            <td><img src="${u.gorsel}" alt=""></td>
                            <td><strong>${u.ad}</strong></td>
                            <td style="color:#f97316; font-weight:800;">${u.fiyat} ₺</td>
                            <td>${u.aciklama || '-'}</td>
                            <td><button class="action-btn" onclick="urunSil('${key}')">Sil</button></td>
                        </tr>
                    `;
                });
            });
        }

        function urunSil(urunKey) {
            if(confirm("Bu ürünü menüden silmek istiyor musunuz?")) {
                db.ref('restaurant_products/' + saticiKey + '/' + urunKey).remove();
            }
        }
    </script>
</body>
</html>
