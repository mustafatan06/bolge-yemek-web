<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Müşteri Profili | Bölge Yemek</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; color: #1e293b; padding-bottom: 50px; }
        header { background: #ffffff; border-bottom: 2px solid #f97316; padding: 12px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .logo { font-size: 20px; font-weight: 800; text-transform: uppercase; text-decoration: none; }
        .logo .bolge { color: #0f172a; } .logo .yemek { color: #f97316; }
        .container { max-width: 800px; margin: 0 auto; padding: 25px 15px; }
        .profile-card { background: #fff; border-radius: 16px; padding: 25px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.03); margin-bottom: 20px; }
        .profile-card h3 { font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f8fafc; font-size: 13px; }
        .info-row span:first-child { color: #64748b; font-weight: 600; }
        .info-row span:last-child { color: #0f172a; font-weight: 700; }
        .btn-danger { background: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo"><span class="bolge">Bölge</span> <span class="yemek">Yemek</span></a>
        <a href="index.html" style="font-size:12px; font-weight:700; color:#f97316; text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Ana Sayfa</a>
    </header>

    <div class="container">
        <div class="profile-card">
            <h3><i class="fa-solid fa-user-circle" style="color:#f97316;"></i> Müşteri Hesap Bilgileriniz</h3>
            <div class="info-row"><span>Ad Soyad:</span> <span id="pAd">-</span></div>
            <div class="info-row"><span>E-posta:</span> <span id="pMail">-</span></div>
            <div class="info-row"><span>Telefon:</span> <span id="pTel">-</span></div>
            <div class="info-row"><span>Kayıtlı Adres:</span> <span id="pAdres">-</span></div>
            <button class="btn-danger" onclick="hesaptanCik()"><i class="fa-solid fa-right-from-bracket"></i> Hesaptan Çıkış Yap</button>
        </div>

        <div class="profile-card">
            <h3><i class="fa-solid fa-clock-rotate-left" style="color:#f97316;"></i> Geçmiş Siparişlerim</h3>
            <div id="gecmisSiparisler" style="font-size: 13px; color: #64748b; text-align: center; padding: 20px;">
                Henüz tamamlanmış bir siparişiniz bulunmuyor.
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const ad = localStorage.getItem('musteriAd');
            if(!ad) {
                alert("Lütfen önce giriş yapın!");
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('pAd').innerText = ad;
            document.getElementById('pMail').innerText = localStorage.getItem('musteriMail') || 'Belirtilmemiş';
            document.getElementById('pTel').innerText = localStorage.getItem('musteriTel');
            document.getElementById('pAdres').innerText = localStorage.getItem('musteriAdres');
        });

        function hesaptanCik() {
            if(confirm("Hesabınızdan çıkış yapmak istediğinize emin misiniz?")) {
                localStorage.removeItem('musteriAd');
                localStorage.removeItem('musteriMail');
                localStorage.removeItem('musteriTel');
                localStorage.removeItem('musteriAdres');
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
